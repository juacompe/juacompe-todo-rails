scan_image:
  stage: image-scan
  image: cacher.odds.team/image/trivy-dind:1.0.0
  variables:
    TRIVY_EXIT_CODE: "0" 
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_SERVER: "https://trivy.odd.works"
    TRIVY_TOKEN: $TRIVY_TOKEN
  services:
    - name: cacher.odds.team/docker/docker:27.2-dind
      alias: docker
    # 5. Some runners require this command to start insecurely on 2375
      command: ["--tls=false"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-non_scan 
    - trivy image --server $TRIVY_SERVER --token $TRIVY_TOKEN $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-non_scan --exit-code $TRIVY_EXIT_CODE --severity $TRIVY_SEVERITY
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-non_scan $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
        docker push $CI_REGISTRY_IMAGE:latest
      fi
  only:
    - main

