stages:
  - base
  - base-tool
  - code-quality
  - build
  - image-scan
  - image-tag
  - update_tag_deployment

variables:
  UPSTREAM_TAG: $CI_COMMIT_SHA
  BUILDX_CONTEXT: ci
  # GITLAB_CI_DISABLE_SERVICE_HEALTH_CHECK: "true"
  CI_DEBUG_TRACE: "true"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2


base-image:
  stage: base
  image: cacher.odds.team/docker/docker:27.2-cli
  services:
    - name: cacher.odds.team/docker/docker:27.2-dind
      alias: docker
    # 5. Some runners require this command to start insecurely on 2375
      command: ["--tls=false"]
  
  before_script:
    - sleep 10
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create $BUILDX_CONTEXT || true
    - docker buildx create --use $BUILDX_CONTEXT || docker buildx use $BUILDX_CONTEXT
  script:
    - |
      docker buildx build \
      --push \
      --platform linux/amd64 \
      --tag  $CI_REGISTRY_IMAGE/base:$CI_COMMIT_SHA \
      --tag  $CI_REGISTRY_IMAGE/base:latest \
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/base:buildcache \
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/base:buildcache,mode=max \
      -f Dockerfile.base . 
  rules:
    - changes:
      - .gitlab-ci.yml
      - Dockerfile.base
      - Gemfile
      - Gemfile.lock
      - .ruby-version

buildtool:
  stage: base-tool
  image: cacher.odds.team/docker/docker:27.2-cli
  services:
    - name: cacher.odds.team/docker/docker:27.2-dind
      alias: docker
    # 5. Some runners require this command to start insecurely on 2375
      command: ["--tls=false"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create $BUILDX_CONTEXT || true
    - docker buildx create --use $BUILDX_CONTEXT || docker buildx use $BUILDX_CONTEXT
  script:
    - |
      BASE_IMAGE=$CI_REGISTRY_IMAGE/base:latest \
      docker buildx build \
      --build-arg BASE_IMAGE=$CI_REGISTRY_IMAGE/base:latest \
      --push \
      --platform linux/amd64 \
      --tag  $CI_REGISTRY_IMAGE/buildtool:$CI_COMMIT_SHA \
      --tag  $CI_REGISTRY_IMAGE/buildtool:latest \
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/buildtool:buildcache \
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/buildtool:buildcache,mode=max \
      -f Dockerfile.buildtool . 
  rules:
    - changes:
      - .gitlab-ci.yml
      - Gemfile
      - Gemfile.lock
      - Dockerfile.base
      - Dockerfile.buildtool

build-test-base:
  stage: base-tool
  image: cacher.odds.team/docker/docker:27.2-cli
  services:
    - name: cacher.odds.team/docker/docker:27.2-dind
      alias: docker
    # 5. Some runners require this command to start insecurely on 2375
      command: ["--tls=false"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create $BUILDX_CONTEXT || true
    - docker buildx create --use $BUILDX_CONTEXT || docker buildx use $BUILDX_CONTEXT
  script:
    - |
       docker buildx build \
        --push \
        --platform linux/amd64 \
        --tag  $CI_REGISTRY_IMAGE/buildtest:$CI_COMMIT_SHA \
        --tag  $CI_REGISTRY_IMAGE/buildtest:latest \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/buildtest:buildcache \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/buildtest:buildcache,mode=max \
        -f Dockerfile.buildtest . 

  rules:
    - if: $CI_COMMIT_TAG == null
      changes:
        - .gitlab-ci.yml
        - Gemfile
        - Gemfile.lock
        - package.json
        - package-lock.json
        - Dockerfile.buildtest
        - .ruby-version

code_linter:
  stage: code-quality
  image: $CI_REGISTRY_IMAGE/buildtest:latest
  before_script:
    - gem install bundler
  cache:
    key: "bundle-${CI_COMMIT_REF_SLUG}"
    paths:
      - vendor/bundle
  script:
    - bundle config set path 'vendor/bundle'
    - bundle install --jobs 4 --retry 3
    - bundle exec rubocop
  rules:
    - if: $CI_COMMIT_TAG == null
      changes:
        - "**/*.rb"
        - "**/*.html"
        - "**/*.erb"
        - "**/*.js"
        - "**/*.ts"


test:
  stage: code-quality
  image: $CI_REGISTRY_IMAGE/buildtest:latest
  before_script:
    - bundle exec rails db:prepare --trace
  script:
    - bundle exec rspec
  artifacts:
    when: always
    paths:
      - coverage/
  rules:
    - if: $CI_COMMIT_TAG == null
      changes:
        - .gitlab-ci.yml
        - Gemfile
        - Gemfile.lock
        - package.json
        - package-lock.json
        - Dockerfile.buildtest
        - .ruby-version
        - "**/*.rb"
        - "**/*.html"
        - "**/*.erb"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.css"
        - "test/**/*"
        - "spec/**/*"
        - "*.properties"

sonarqube:
  stage: code-quality
  tags:
    - x86
  image:
    name: cacher.odds.team/docker-hub-cache/sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}"
  allow_failure: true
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  needs:
    - job: test
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG == null
      changes:
        - .gitlab-ci.yml
        - Gemfile
        - Gemfile.lock
        - package.json
        - package-lock.json
        - Dockerfile.buildtest
        - .ruby-version
        - "**/*.rb"
        - "**/*.html"
        - "**/*.erb"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.css"
        - "test/**/*"
        - "spec/**/*"
        - "*.properties"

build-image:
  stage: build
  image: cacher.odds.team/docker/docker:27.2-cli
  services:
    - name: cacher.odds.team/docker/docker:27.2-dind
      alias: docker
    # 5. Some runners require this command to start insecurely on 2375
      command: ["--tls=false"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create $BUILDX_CONTEXT || true
    - docker buildx create --use $BUILDX_CONTEXT || docker buildx use $BUILDX_CONTEXT

  script:
    - |
      docker buildx build \
      --build-arg REG_URL=$CI_REGISTRY_IMAGE \
      --push \
      --platform linux/amd64 \
      --tag  $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-non_scan \
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max \
      -f Dockerfile.multi . 
  only:
    - main

