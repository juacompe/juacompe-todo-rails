sonar.projectKey=ODDS-todo-juacompe-todo-rails
sonar.qualitygate.wait=true

# For Go coverage
sonar.projectBaseDir=/builds/ODDS/todo/juacompe-todo-rails

# Ruby/Rails configuration
sonar.sources=app
sonar.tests=spec
sonar.test.inclusions=spec/**/*_spec.rb
sonar.test.exclusions=**/vendor/**
sonar.exclusions=**/vendor/**,**/node_modules/**,**/tmp/**,**/log/**,**/public/**
sonar.ruby.coverage.reportPaths=coverage/coverage.json


